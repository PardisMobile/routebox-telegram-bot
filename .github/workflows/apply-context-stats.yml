name: Apply scoped context stats patch

on:
  push:
    branches: [ATD-Panel]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only the existing stats renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          core = Path('public/index.core.php')
          s = core.read_text()

          s2 = s.replace("$allowedSections = ['dashboard', 'servers', 'bot', 'plans', 'security', 'updates'];", "$allowedSections = ['dashboard', 'servers', 'bot', 'plans', 'security', 'updates', 'ibsng', 'mikrotik'];", 1)
          if s2 == s:
              raise SystemExit('allowedSections marker not found')
          s = s2

          marker = '''  <div class="stats">\n    <div class="stat"><div class="stat-top"><span><?=$T['servers']?></span><span class="stat-icon"><?=navIcon('servers')?></span></div><b><?=count($servers)?></b></div>\n    <div class="stat"><div class="stat-top"><span><?=$T['users']?></span><span class="stat-icon"><?=navIcon('bot')?></span></div><b><?=number_format($users)?></b></div>\n    <div class="stat"><div class="stat-top"><span><?=$T['plans']?></span><span class="stat-icon"><?=navIcon('plans')?></span></div><b><?=count($plans)?></b></div>\n    <div class="stat"><div class="stat-top"><span><?=$T['version']?></span><span class="stat-icon"><?=navIcon('updates')?></span></div><b style="font-size:18px">v<?=h($version)?></b></div>\n  </div>\n'''

          replacement = '''  <?php
  $statsServers = count($servers);
  $statsUsers = $users;
  $statsPlans = count($plans);
  $statsFourthLabel = $T['version'];
  $statsFourthValue = 'v' . $version;
  if ($section === 'servers') {
      $statsUsers = (int)db()->query("SELECT COUNT(DISTINCT telegram_user_id) FROM service_subscriptions WHERE provider_key='routebox' AND status != 'deleted'")->fetchColumn();
      $statsPlans = (int)db()->query("SELECT COUNT(*) FROM service_plans WHERE provider_key='routebox'")->fetchColumn();
  } elseif ($section === 'ibsng') {
      $statsServers = (int)db()->query('SELECT COUNT(*) FROM ibsng_servers')->fetchColumn();
      $statsUsers = (int)db()->query("SELECT COUNT(DISTINCT telegram_user_id) FROM service_subscriptions WHERE provider_key='ibsng' AND status != 'deleted'")->fetchColumn();
      $statsPlans = (int)db()->query("SELECT COUNT(*) FROM service_plans WHERE provider_key='ibsng'")->fetchColumn();
  } elseif ($section === 'mikrotik') {
      $statsServers = (int)db()->query('SELECT COUNT(*) FROM mikrotik_servers')->fetchColumn();
      $statsUsers = (int)db()->query("SELECT COUNT(DISTINCT telegram_user_id) FROM service_subscriptions WHERE provider_key='mikrotik_wireguard' AND status != 'deleted'")->fetchColumn();
      $statsPlans = (int)db()->query("SELECT COUNT(*) FROM service_plans WHERE provider_key='mikrotik_wireguard'")->fetchColumn();
  }
  ?>
  <div class="stats">
    <div class="stat"><div class="stat-top"><span><?=$T['servers']?></span><span class="stat-icon"><?=navIcon('servers')?></span></div><b><?=number_format($statsServers)?></b></div>
    <div class="stat"><div class="stat-top"><span><?=$T['users']?></span><span class="stat-icon"><?=navIcon('bot')?></span></div><b><?=number_format($statsUsers)?></b></div>
    <div class="stat"><div class="stat-top"><span><?=$T['plans']?></span><span class="stat-icon"><?=navIcon('plans')?></span></div><b><?=number_format($statsPlans)?></b></div>
    <div class="stat"><div class="stat-top"><span><?=$statsFourthLabel?></span><span class="stat-icon"><?=navIcon('updates')?></span></div><b style="font-size:18px"><?=h($statsFourthValue)?></b></div>
  </div>
'''

          if marker not in s:
              raise SystemExit('stats marker not found')
          s = s.replace(marker, replacement, 1)
          core.write_text(s)

          idx = Path('public/index.php')
          p = idx.read_text()
          old = "    $_GET['section'] = 'dashboard';"
          new = "    $_GET['section'] = $requestedSection;"
          if old not in p:
              raise SystemExit('special-section GET marker not found')
          p = p.replace(old, new, 1)
          idx.write_text(p)
          PY

          php -l public/index.core.php
          php -l public/index.php
          git diff --check

      - name: Commit patch and remove one-shot workflow
        run: |
          rm -f .github/workflows/apply-context-stats.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.core.php public/index.php .github/workflows/apply-context-stats.yml
          git commit -m 'fix(admin): scope existing stats to current provider context' || exit 0
          git push