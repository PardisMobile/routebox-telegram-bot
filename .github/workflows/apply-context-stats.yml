name: Apply scoped context stats patch

on:
  push:
    branches: [ATD-Panel]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing stats row only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          core = Path('public/index.core.php')
          s = core.read_text()

          start = s.find('  <div class="stats">')
          if start < 0:
              raise SystemExit('existing stats row not found')
          end = s.find('  </div>\n\n  <?php if($section===\'dashboard\'): ?>', start)
          if end < 0:
              raise SystemExit('existing stats row end marker not found')
          end += len('  </div>')

          replacement = '''  <?php
          $statsServers = count($servers);
          $statsUsers = $users;
          $statsPlans = count($plans);
          $statsFourthLabel = $T['version'];
          $statsFourthValue = 'v' . $version;
          if ($section === 'servers') {
              $statsUsers = (int)db()->query("SELECT COUNT(DISTINCT telegram_user_id) FROM service_subscriptions WHERE provider_key='routebox' AND status != 'deleted'")->fetchColumn();
              $statsPlans = (int)db()->query("SELECT COUNT(*) FROM service_plans WHERE provider_key='routebox'")->fetchColumn();
          }
          ?>
          <div class="stats">
            <div class="stat"><div class="stat-top"><span><?=$T['servers']?></span><span class="stat-icon"><?=navIcon('servers')?></span></div><b><?=number_format($statsServers)?></b></div>
            <div class="stat"><div class="stat-top"><span><?=$T['users']?></span><span class="stat-icon"><?=navIcon('bot')?></span></div><b><?=number_format($statsUsers)?></b></div>
            <div class="stat"><div class="stat-top"><span><?=$T['plans']?></span><span class="stat-icon"><?=navIcon('plans')?></span></div><b><?=number_format($statsPlans)?></b></div>
            <div class="stat"><div class="stat-top"><span><?=$statsFourthLabel?></span><span class="stat-icon"><?=navIcon('updates')?></span></div><b style="font-size:18px"><?=h($statsFourthValue)?></b></div>
          </div>'''
          core.write_text(s[:start] + replacement + s[end:])

          idx = Path('public/index.php')
          p = idx.read_text()
          old = "    $_GET['section'] = 'dashboard';"
          new = "    $_GET['section'] = $requestedSection;"
          if old not in p:
              raise SystemExit('special-section marker not found')
          idx.write_text(p.replace(old, new, 1))
          PY
          php -l public/index.core.php
          php -l public/index.php
          git diff --check
      - name: Commit patch and remove one-shot workflow
        run: |
          rm -f .github/workflows/apply-context-stats.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.core.php public/index.php .github/workflows/apply-context-stats.yml
          git commit -m 'fix(admin): scope existing stats to current section'
          git push