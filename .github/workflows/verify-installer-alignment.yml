name: Verify installer alignment

on:
  push:
    branches: [ATD-Panel]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current installer files
        run: |
          set -e
          for file in install.sh installer-core.sh install-dev.sh install-dev-full.sh; do
            test -f "$file"
            bash -n "$file"
          done
      - name: Reject stale active installer references
        run: |
          set -e
          for file in install.sh installer-core.sh install-dev.sh install-dev-full.sh update.sh backup.sh admin-update.sh admin-cli.sh restore-backup.sh uninstall.sh; do
            if grep -n 'install-v2\.sh' "$file"; then
              echo "ERROR: stale install-v2.sh reference found in active file: $file"
              exit 1
            fi
          done
