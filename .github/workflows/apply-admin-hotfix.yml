name: Apply admin panel hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch RouteBox Admin panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.php')
          s = p.read_text()

          old = '<a class="mini-link" href="<?=h(SUPPORT_URL)?>" target="_blank" rel="noopener"><?=navIcon(\'bot\')?> <?=$T[\'support\']?></a>'
          new = '<a class="mini-link" href="https://github.com/PardisMobile/routebox-telegram-bot" target="_blank" rel="noopener noreferrer">GitHub</a>'
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          php -l public/index.php
          git diff --check

      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.php
          git commit -m 'fix(admin): replace sidebar support with GitHub link' || exit 0
          git push
