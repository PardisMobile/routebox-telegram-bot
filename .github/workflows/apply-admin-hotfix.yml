name: Apply admin panel hotfix

on:
  push:
    branches: [feature/telegram-bot-admin-mikrotik]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MikroTik Telegram worker
        run: |
          set -euo pipefail
          python3 tools/patch-mikrotik-telegram-worker.py
          php -l worker.php
          git diff --check
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.php tools/patch-mikrotik-telegram-worker.py
          git commit -m 'feat: complete MikroTik Telegram service flow'
          git push origin HEAD:feature/telegram-bot-admin-mikrotik
