name: Fix existing admin stats row

on:
  push:
    branches: [ATD-Panel]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl,mbstring,pdo_sqlite,sodium
          coverage: none
      - name: Patch existing stats context
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('public/index.core.php')
          s = p.read_text()
          pattern = r"\$statsServers\s*=\s*[^;]+;"
          replacement = "$statsServers = $section === 'servers' ? count($servers) : $globalServerCount;"
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one statsServers assignment, found {n}; refusing to modify the file.')
          p.write_text(s2)
          PY
          php -l public/index.core.php
          php -l public/index.php
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.core.php
          git commit -m 'fix(admin): scope existing stats row by section'
          git push
