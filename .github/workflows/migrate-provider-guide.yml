name: Migrate Provider Guide Renderer

on:
  push:
    branches: [ATD-Panel]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ATD-Panel
        uses: actions/checkout@v4
        with:
          ref: ATD-Panel
          fetch-depth: 1

      - name: Switch Provider Guide renderer to repository docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Admin/ATDPanelSections.php')
          text = path.read_text(encoding='utf-8')
          start = text.find('    public static function renderProviderGuide(')
          end = text.find('    public static function renderUsers(', start)
          if start < 0 or end < 0:
              raise SystemExit('Provider Guide method boundaries not found')
          replacement = '''    public static function renderProviderGuide(PDO $db,string $provider,string $lang,string $csrf): string {
          return ProviderGuideSection::render($provider, $lang);
      }

'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Validate PHP
        run: |
          php -l src/Admin/ATDPanelSections.php
          php -l src/Admin/ProviderGuideSection.php
          php -l docs/providers/manifest.php

      - name: Remove temporary migration workflow and commit
        run: |
          rm -f .github/workflows/migrate-provider-guide.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Admin/ATDPanelSections.php src/Admin/ProviderGuideSection.php docs/providers .github/workflows/migrate-provider-guide.yml
          git diff --cached --quiet && exit 0
          git commit -m "refactor: make provider guides repository-managed"
          git push origin HEAD:ATD-Panel
