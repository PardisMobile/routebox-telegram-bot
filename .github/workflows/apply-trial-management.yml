name: Trial management verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax verification
        shell: bash
        run: |
          set -euo pipefail
          php -l worker.php
          php -l src/Services/TrialService.php
          php -l src/Admin/TrialAdminPanel.php
