## Telegram Trial Management — 2026-10-05
- Trial configuration is provider/category-specific and references the existing `service_plans` rows; no provider is hard-coded into Plan selection.
- The permanent `telegram_trials` claim ledger is never deleted during Trial cleanup. Removing an expired provider resource therefore cannot let the same Telegram user claim a second Trial.
- `telegram_trial_instances` is the lifecycle/cleanup ledger and is separate from the permanent claim ledger.
- RouteBox legacy `trial_hours` remains a compatibility fallback when no RouteBox Trial Plan is configured.
- RouteBox and MikroTik cleanup reuse existing provider integrations. IBSng cleanup is intentionally blocked until the existing IBSng adapter exposes a safe delete operation; the Trial is not silently deleted from the local database while the provider account remains.
