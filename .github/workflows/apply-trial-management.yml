        $l=langFor($uid); tg($token,'sendMessage',['chat_id'=>$chat,'text'=>$l==='fa'?'✅ تست رایگان RouteBox شما فعال شد.\n\n📋 برای دریافت Config یا QR از «سرویس‌های من» استفاده کنید.':'✅ Your RouteBox free trial is active.\n\n📋 Use My services to get your Config or QR.', 'reply_markup'=>json_encode(['inline_keyboard'=>[[['text'=>$l==='fa'?'📋 سرویس‌های من':'📋 My services','callback_data'=>'services']]]],JSON_UNESCAPED_UNICODE)]);
        return;
