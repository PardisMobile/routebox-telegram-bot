name: PHP and installer checks

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe admin stats patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/ATD-Panel' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.core.php')
          s = p.read_text()
          old = '$statsServers = $globalServerCount;'
          new = "$statsServers = $section === 'servers' ? count($servers) : $globalServerCount;"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          php -l public/index.core.php
          git diff --check
          if git diff --quiet -- public/index.core.php; then
            echo 'No stats patch needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/index.core.php
            git commit -m 'fix(admin): scope existing stats row by section'
            git push
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl,mbstring,pdo_sqlite,sodium
          coverage: none

      - name: Validate PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n installer-core.sh
          bash -n install-dev.sh
          bash -n install-dev-full.sh
          bash -n update.sh
          bash -n uninstall.sh

      - name: Validate required PHP extensions
        shell: bash
        run: |
          set -euo pipefail
          php -r 'foreach (["curl", "mbstring", "pdo_sqlite", "sodium"] as $ext) { if (!extension_loaded($ext)) { fwrite(STDERR, "Missing PHP extension: $ext\n"); exit(1); } } echo "Required PHP extensions are available.\n";'

      - name: Validate RouteBox client API surface
        shell: bash
        run: |
          set -euo pipefail
          php -r 'require "src/RouteBoxClient.php"; $r = new RouteBoxClient("http://127.0.0.1:8080"); foreach (["health","status","awgStatus","settings","peers","validateIntegration","createPeer","smokeTest","config","vpnLink","singbox","setExpiry","resetTraffic","deletePeer"] as $m) { if (!method_exists($r, $m)) { fwrite(STDERR, "Missing RouteBoxClient method: $m\n"); exit(1); } } echo "RouteBoxClient API surface OK.\n";'
