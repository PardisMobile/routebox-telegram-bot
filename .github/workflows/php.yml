name: PHP and installer checks

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl,mbstring,pdo_sqlite,sodium
          coverage: none

      - name: Validate PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n install-v2.sh
          bash -n update.sh
          bash -n uninstall.sh

      - name: Validate required PHP extensions
        shell: bash
        run: |
          set -euo pipefail
          php -r 'foreach (["curl", "mbstring", "pdo_sqlite", "sodium"] as $ext) { if (!extension_loaded($ext)) { fwrite(STDERR, "Missing PHP extension: $ext\n"); exit(1); } } echo "Required PHP extensions are available.\n";'

      - name: Validate RouteBox integration contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/auth/login' src/RouteBoxClient.php
          grep -q '/api/awg/peers' src/RouteBoxClient.php
          grep -q '/api/awg/peers/' src/RouteBoxClient.php
          grep -q 'sessionCookie' src/RouteBoxClient.php
          grep -q 'Full RouteBox + AmneziaWG create/export/delete smoke test OK' install-v2.sh
          echo "RouteBox session + AWG smoke-test contract present."
