name: PHP checks
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l src/bootstrap.php
      - run: php -l src/RouteBoxClient.php
      - run: php -l public/index.php
      - run: php -l public/login.php
      - run: php -l public/logout.php
      - run: php -l worker.php
      - run: php -l bot.php
