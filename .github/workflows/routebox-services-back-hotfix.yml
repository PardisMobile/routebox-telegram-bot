name: RouteBox Services Back Button Hotfix

on:
  push:
    branches:
      - feature/telegram-bot-admin-mikrotik

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add main menu button to Services
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('worker.php')
          s = p.read_text()

          start = s.index('function sendServices(')
          end = s.index('\nfunction serviceActions(', start)
          block = s[start:end]

          marker = "    tg($token, 'sendMessage', ['chat_id' => $chat, 'text' => $text, 'reply_markup' => json_encode(['inline_keyboard' => $k], JSON_UNESCAPED_UNICODE)]);"
          replacement = "    $k[] = [['text' => $l === 'fa' ? '🔙 منوی اصلی' : '🔙 Main Menu', 'callback_data' => 'menu']];\n" + marker

          if marker not in block:
              raise SystemExit('Services render marker not found.')
          if "'callback_data' => 'menu'" not in block:
              block = block.replace(marker, replacement, 1)
              s = s[:start] + block + s[end:]
              p.write_text(s)
          PY

          php -l worker.php
          git diff --check
          grep -n -A2 -B2 "🔙 منوی اصلی" worker.php

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.php
          git rm .github/workflows/routebox-services-back-hotfix.yml
          git commit -m 'fix(bot): add back button to services menu'
          git push
