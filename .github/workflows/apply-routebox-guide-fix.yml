name: Apply RouteBox UI and guide fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # worker.php: normalize escaped newlines robustly so Telegram never shows literal \\n          p = Path('worker.php')
          s = p.read_text()
          old = '''function cleanT(string $t):string{return trim(str_replace(["\\\\r\\\\n","\\\\n","/n"],"\\n",$t));}'''
          new = '''function cleanT(string $t):string{do{$before=$t;$t=str_replace(["\\\\r\\\\n","\\\\n","/n"],"\\n",$t);}while($t!==$before);return trim($t);}'''
          if old not in s:
              raise SystemExit('worker cleanT target not found')
          p.write_text(s.replace(old,new,1))

          # admin_features.php: keep guide editing with the Telegram Bot section,
          # remove it from Tools, and show the hard-coded guide button in the menu preview.
          p = Path('src/admin_features.php')
          s = p.read_text()

          old = '''function rbt_set(string $key, string $value): void
{
    db()->prepare('INSERT INTO settings(key,value) VALUES(?,?) ON CONFLICT(key) DO UPDATE SET value=excluded.value')
        ->execute([$key, $value]);
}'''
          new = '''function rbt_set(string $key, string $value): void
{
    if (in_array($key, ['guide_fa', 'guide_en'], true)) {
        do {
            $before = $value;
            $value = str_replace(["\\\\r\\\\n", "\\\\n", "/n"], "\\n", $value);
        } while ($value !== $before);
    }

    db()->prepare('INSERT INTO settings(key,value) VALUES(?,?) ON CONFLICT(key) DO UPDATE SET value=excluded.value')
        ->execute([$key, $value]);
}'''
          if old not in s:
              raise SystemExit('admin rbt_set target not found')
          s = s.replace(old,new,1)

          old = '''        . '<p class="help">Only the newest 10 backups are retained. Backup files live outside the public web root.</p></section>'
        . $guide
        . $serverSettings;'''
          new = '''        . '<p class="help">Only the newest 10 backups are retained. Backup files live outside the public web root.</p></section>'
        . $serverSettings;'''
          if old not in s:
              raise SystemExit('tools guide target not found')
          s = s.replace(old,new,1)

          old = '''    if ($section === 'tools') {
        // The base index marks Dashboard active before this output-buffer extension'''
          new = '''    if ($section === 'bot') {
        // Keep the usage guide settings with Telegram Bot, next to the bot menu preview.
        $guideCss = '<style>.rbt-bot-guide{margin-top:24px}.rbt-preview-guide{opacity:.96}</style>';
        $guideHtml = $guideCss . $guide;

        // The preview is generated by public/index.php. Add the same guide button that
        // worker.php adds to the real Telegram menu so the preview stays faithful.
        $previewIndex = 0;
        $html = preg_replace_callback('/(<div class="chat">.*?)(<\\/div><\\/div>)/is', static function (array $m) use (&$previewIndex): string {
            $previewIndex++;
            $fa = $previewIndex === 1;
            $button = '<div class="preview-btn rbt-preview-guide" dir="' . ($fa ? 'rtl' : 'ltr') . '">📚 ' . ($fa ? 'راهنمای استفاده' : 'Usage guide') . '</div>';
            return $m[1] . $button . $m[2];
        }, $html, 2) ?? $html;

        $html = preg_replace('/<\\/main>/i', $guideHtml . '</main>', $html, 1) ?? $html;
    }

    if ($section === 'tools') {
        // The base index marks Dashboard active before this output-buffer extension'''
          if old not in s:
              raise SystemExit('bot insertion point not found')
          s = s.replace(old,new,1)

          p.write_text(s)
          PY

          php -l worker.php
          php -l src/admin_features.php
          git diff --check
          git status --short

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.php src/admin_features.php
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "fix: move usage guide into Telegram Bot and normalize guide text"
          git push
