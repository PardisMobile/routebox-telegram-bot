name: ATD status pill alignment

on:
  push:
    branches: [ATD-Panel]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align provider and worker status pills
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/Admin/ATDStats.php')
          s = p.read_text(encoding='utf-8')

          old_provider = '<div class="atd-status-state"><i style="background:'.$color.'"></i>'.$esc($status).'</div>'
          new_provider = '<span class="status"><span class="dot" style="background:'.$color.'"></span>'.$esc($status).'</span>'
          old_worker = '<div class="atd-status-state"><i style="background:'.$color.'"></i>'.$esc($state).'</div>'
          new_worker = '<span class="status"><span class="dot" style="background:'.$color.'"></span>'.$esc($state).'</span>'

          if old_provider not in s:
              raise SystemExit('Provider status markup not found')
          if old_worker not in s:
              raise SystemExit('Worker status markup not found')

          s = s.replace(old_provider, new_provider, 1)
          s = s.replace(old_worker, new_worker, 1)
          p.write_text(s, encoding='utf-8')
          PY

          php -l src/Admin/ATDStats.php
          git diff --check

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/atd-status-pill-fix.yml
          git add src/Admin/ATDStats.php
          git commit -m 'fix(admin): align provider and worker status pills'
          git push
